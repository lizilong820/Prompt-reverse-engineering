server {
    listen 80;
    listen [::]:80;
    server_name prompt.whaios.com;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/prompt.whaios.com;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name prompt.whaios.com;

    ssl_certificate /etc/letsencrypt/live/prompt.whaios.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prompt.whaios.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 180m;

    location / {
        proxy_pass http://127.0.0.1:9001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 15s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }
}
